# SYNTHETIC FIXTURE ONLY. Not a calibration of the physical sensor.
image_width: 640
image_height: 480
camera_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [800., 0., 320., 0., 800., 240., 0., 0., 1.]
distortion_coefficients: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [0., 0., 0., 0., 0.]
laser_plane: !!opencv-matrix
   rows: 1
   cols: 4
   dt: d
   data: [0., 1., 1., -200.]
